[package]
name = "tokedex"
version = "0.1.0"
edition = "2024"
description = "Explore token vocabulary coverage in local agent conversations"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiktoken-rs = "0.12"
walkdir = "2"
